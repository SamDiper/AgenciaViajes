<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <div th:fragment="hotel-form" class="space-y-6 max-w-3xl mx-auto">

        <!-- Encabezado de Formulario -->
        <div class="flex items-center justify-between border-b border-slate-200/80 pb-4">
            <div>
                <a th:href="@{/admin/hoteles}" class="text-xs font-semibold text-slate-400 hover:text-[#073B78] transition flex items-center gap-1.5 mb-1">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i>
                    <span>Volver al listado</span>
                </a>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900"
                    th:text="${hotel.idHotel != null ? 'Editar Hotel' : 'Nuevo Hotel'}">
                    Nuevo Hotel
                </h1>
            </div>
            <div class="w-10 h-10 rounded-xl bg-slate-100 text-[#073B78] flex items-center justify-center font-bold text-base">
                <i class="fa-solid fa-hotel"></i>
            </div>
        </div>

        <!-- Formulario -->
        <form th:action="@{/admin/hoteles/guardar}" th:object="${hotel}" method="post"
              class="bg-white rounded-2xl border border-slate-200/80 p-6 sm:p-8 shadow-xs space-y-5">

            <!-- ID oculto para edición -->
            <input type="hidden" th:field="*{idHotel}" />

            <!-- Nombre del Hotel -->
            <div>
                <label for="nombre" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Nombre del Hotel <span class="text-rose-500">*</span>
                </label>
                <input type="text" id="nombre" th:field="*{nombre}" required
                       placeholder="Ej: Hotel Las Américas Resort, Hotel Caribe..."
                       class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition" />
            </div>

            <!-- Destino Asociado y Categoría de Estrellas -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Destino -->
                <div>
                    <label for="destino" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                        Destino de Ubicación <span class="text-rose-500">*</span>
                    </label>
                    <select id="destino" th:field="*{destino.idDestino}" required
                            class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition">
                        <option value="">-- Seleccionar Destino --</option>
                        <option th:each="dest : ${destinos}"
                                th:value="${dest.idDestino}"
                                th:text="${dest.nombre + ' (' + dest.ciudad + ')'}">
                            Cartagena (Cartagena)
                        </option>
                    </select>
                </div>

                <!-- Estrellas (1 a 5) -->
                <div>
                    <label for="estrellas" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                        Calificación (Estrellas) <span class="text-rose-500">*</span>
                    </label>
                    <select id="estrellas" th:field="*{estrellas}" required
                            class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition">
                        <option value="1">⭐ (1 Estrella)</option>
                        <option value="2">⭐⭐ (2 Estrellas)</option>
                        <option value="3">⭐⭐⭐ (3 Estrellas)</option>
                        <option value="4">⭐⭐⭐⭐ (4 Estrellas)</option>
                        <option value="5">⭐⭐⭐⭐⭐ (5 Estrellas - Lujo)</option>
                    </select>
                </div>
            </div>

            <!-- Suplemento Tarifario y Estado -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Precio Adicional (COP) -->
                <div>
                    <label for="precioAdicional" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                        Suplemento Tarifario (COP)
                    </label>
                    <input type="number" id="precioAdicional" th:field="*{precioAdicional}" step="10000" min="0"
                           placeholder="0"
                           class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 font-medium rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition" />
                </div>

                <!-- Estado -->
                <div>
                    <label for="estado" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                        Estado <span class="text-rose-500">*</span>
                    </label>
                    <select id="estado" th:field="*{estado}" required
                            class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition">
                        <option value="ACTIVO">Activo (Disponible en paquetes)</option>
                        <option value="INACTIVO">Inactivo (No disponible)</option>
                    </select>
                </div>
            </div>

            <!-- Descripción del Hotel -->
            <div>
                <label for="descripcion" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Descripción / Servicios del Hotel
                </label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="3"
                          placeholder="Detalles del hospedaje, tipo de habitaciones, instalaciones y comodidades..."
                          class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition"></textarea>
            </div>

            <!-- Botones de Acción -->
            <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                <a th:href="@{/admin/hoteles}"
                   class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition">
                    Cancelar
                </a>
                <button type="submit"
                        class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-[#073B78] hover:bg-[#052b57] shadow-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk text-xs"></i>
                    <span th:text="${hotel.idHotel != null ? 'Actualizar Hotel' : 'Guardar Hotel'}">Guardar</span>
                </button>
            </div>
        </form>

    </div>

</body>

</html>
