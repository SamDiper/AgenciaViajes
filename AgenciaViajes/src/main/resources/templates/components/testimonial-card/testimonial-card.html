<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- ==========================================
         TESTIMONIAL CARD COMPONENT
         ========================================== -->
    <div th:fragment="testimonial-card(name, location, avatar, comment, destinationVisited)" 
         class="testimonial-card bg-white rounded-2xl p-6 sm:p-7 shadow-md hover:shadow-xl transition-all duration-300 border border-slate-100 flex flex-col justify-between h-full group hover:-translate-y-1">
        
        <div>
            <!-- Author Header -->
            <div class="flex items-center gap-3.5 mb-4">
                <img th:src="${avatar}" 
                     src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop" 
                     th:alt="${name}" 
                     class="w-12 h-12 rounded-full object-cover border-2 border-slate-100 shadow-sm" />
                
                <div>
                    <h4 th:text="${name}" class="text-sm sm:text-base font-bold text-[#073B78] tracking-tight">
                        Laura Martínez
                    </h4>
                    <p th:text="${location}" class="text-xs text-slate-500 font-medium">
                        Medellín, Colombia
                    </p>
                </div>
            </div>

            <!-- 5 Star Rating -->
            <div class="flex items-center gap-1 mb-3.5 text-amber-400">
                <i class="fa-solid fa-star text-sm"></i>
                <i class="fa-solid fa-star text-sm"></i>
                <i class="fa-solid fa-star text-sm"></i>
                <i class="fa-solid fa-star text-sm"></i>
                <i class="fa-solid fa-star text-sm"></i>
            </div>

            <!-- Comment Quote -->
            <p th:text="${'&quot;' + comment + '&quot;'}" class="text-xs sm:text-sm text-slate-600 leading-relaxed italic mb-6">
                "Una experiencia increíble. Colombia tiene lugares hermosos y Traveling Colombia hizo que descubrirlos fuera mucho más fácil."
            </p>
        </div>

        <!-- Destination Tag Visited -->
        <div class="pt-3 border-t border-slate-100 flex items-center gap-1.5 text-xs font-semibold text-[#073B78]">
            <i class="fa-solid fa-location-dot text-[#073B78] text-xs"></i>
            <span th:text="${destinationVisited}">Guatapé</span>
        </div>

    </div>
</body>
</html>
