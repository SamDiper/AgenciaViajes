<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <div th:fragment="paquete-form" class="space-y-6 max-w-4xl mx-auto">

        <!-- Encabezado de Formulario -->
        <div class="flex items-center justify-between border-b border-slate-200/80 pb-4">
            <div>
                <a th:href="@{/admin/paquetes}" class="text-xs font-semibold text-slate-400 hover:text-[#073B78] transition flex items-center gap-1.5 mb-1">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i>
                    <span>Volver al listado</span>
                </a>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900"
                    th:text="${paquete.idPaquete != null ? 'Editar Paquete Turístico' : 'Nuevo Paquete Turístico'}">
                    Nuevo Paquete Turístico
                </h1>
            </div>
            <div class="w-10 h-10 rounded-xl bg-slate-100 text-[#073B78] flex items-center justify-center font-bold text-base">
                <i class="fa-solid fa-suitcase"></i>
            </div>
        </div>

        <!-- Formulario -->
        <form th:action="@{/admin/paquetes/guardar}" th:object="${paquete}" method="post" id="paqueteForm"
              class="bg-white rounded-2xl border border-slate-200/80 p-6 sm:p-8 shadow-xs space-y-6">

            <!-- ID oculto para edición -->
            <input type="hidden" th:field="*{idPaquete}" />

            <!-- Bloque 1: Información Básica -->
            <div class="space-y-4">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-100 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-circle-info text-[#073B78]"></i>
                    <span>Información Principal</span>
                </h3>

                <!-- Nombre del Paquete -->
                <div>
                    <label for="nombre" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                        Nombre del Paquete <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="nombre" th:field="*{nombre}" required
                           placeholder="Ej: Cartagena Colonial y Caribe, Valle del Cocora..."
                           class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition" />
                </div>

                <!-- Destino, Duración y Precio Base -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <!-- Destino -->
                    <div>
                        <label for="destino" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                            Destino <span class="text-rose-500">*</span>
                        </label>
                        <select id="destino" th:field="*{destino.idDestino}" required
                                class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition">
                            <option value="">-- Seleccionar Destino --</option>
                            <option th:each="dest : ${destinos}"
                                    th:value="${dest.idDestino}"
                                    th:text="${dest.nombre + ' (' + dest.ciudad + ')'}">
                                Cartagena (Cartagena)
                            </option>
                        </select>
                    </div>

                    <!-- Duración (Días) -->
                    <div>
                        <label for="duracionDias" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                            Duración (Días) <span class="text-rose-500">*</span>
                        </label>
                        <input type="number" id="duracionDias" th:field="*{duracionDias}" min="1" max="60" required
                               placeholder="Ej: 4"
                               class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 font-medium rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition" />
                    </div>

                    <!-- Precio Base (COP) -->
                    <div>
                        <label for="precioBase" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                            Precio Base (COP) <span class="text-rose-500">*</span>
                        </label>
                        <input type="number" id="precioBase" th:field="*{precioBase}" step="10000" min="0" required
                               placeholder="Ej: 1200000"
                               class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 font-bold rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition" />
                    </div>
                </div>

                <!-- Imagen URL y Estado -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="sm:col-span-2">
                        <label for="imagenUrl" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                            URL Imagen de Portada
                        </label>
                        <input type="url" id="imagenUrl" th:field="*{imagenUrl}"
                               placeholder="https://images.unsplash.com/photo-..."
                               class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition" />
                    </div>

                    <div>
                        <label for="estado" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                            Estado <span class="text-rose-500">*</span>
                        </label>
                        <select id="estado" th:field="*{estado}" required
                                class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition">
                            <option value="ACTIVO">Activo (Visible)</option>
                            <option value="INACTIVO">Inactivo (Oculto)</option>
                        </select>
                    </div>
                </div>

                <!-- Descripción General -->
                <div>
                    <label for="descripcion" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                        Descripción General del Paquete
                    </label>
                    <textarea id="descripcion" th:field="*{descripcion}" rows="3"
                              placeholder="Resumen atractivo del paquete turístico..."
                              class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition"></textarea>
                </div>
            </div>

            <!-- Bloque 2: Servicios Asociados (Hotel y Aerolínea) -->
            <div class="space-y-4 pt-2">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-100 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-link text-[#073B78]"></i>
                    <span>Servicios y Alojamientos Asociados</span>
                </h3>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Aerolínea Asociada -->
                    <div>
                        <label for="aerolinea" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                            Aerolínea Asignada
                        </label>
                        <select id="aerolinea" th:field="*{aerolinea.idAerolinea}"
                                class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition">
                            <option value="">-- Sin aerolínea (Solo terrestre / Ninguna) --</option>
                            <option th:each="aero : ${aerolineas}"
                                    th:value="${aero.idAerolinea}"
                                    th:text="${aero.nombre + (aero.codigoIata != null ? ' [' + aero.codigoIata + ']' : '')}">
                                Avianca [AV]
                            </option>
                        </select>
                    </div>

                    <!-- Hotel Asociado -->
                    <div>
                        <label for="hotel" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                            Hotel / Hospedaje Asignado
                        </label>
                        <select id="hotel" th:field="*{hotel.idHotel}"
                                class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition">
                            <option value="">-- Sin hotel (No aplica) --</option>
                            <option th:each="hot : ${hoteles}"
                                    th:value="${hot.idHotel}"
                                    th:text="${hot.nombre + ' (' + hot.estrellas + '★)'}">
                                Hotel Caribe (4★)
                            </option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Bloque 3: ¿Qué incluye? (Dinámico con Input y Botón +) -->
            <div class="space-y-3 pt-2">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <i class="fa-solid fa-circle-check text-emerald-600"></i>
                        <span>¿Qué incluye el paquete?</span>
                    </h3>
                    <span class="text-[11px] text-slate-400 font-medium">Agrega beneficios o servicios incluidos</span>
                </div>

                <!-- Input + Botón para agregar item -->
                <div class="flex gap-2">
                    <input type="text" id="inputIncluye"
                           placeholder="Ej: Guía bilingüe certificado, Almuerzo típico caribeño..."
                           class="flex-1 px-3.5 py-2 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition" />
                    <button type="button" id="btnAgregarIncluye"
                            class="px-4 py-2 rounded-xl text-xs font-bold text-white bg-[#073B78] hover:bg-[#052b57] shadow-xs flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>Agregar</span>
                    </button>
                </div>

                <!-- Lista de items agregados -->
                <div id="contenedorIncluye" class="space-y-2 pt-1">
                    <!-- Items existentes si estamos editando -->
                    <div th:each="item : ${paquete.incluye}"
                         class="item-incluye flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 text-xs">
                        <div class="flex items-center gap-2 text-slate-700">
                            <i class="fa-solid fa-check text-emerald-600 text-xs shrink-0"></i>
                            <span th:text="${item}">Servicio incluido</span>
                        </div>
                        <input type="hidden" name="incluye" th:value="${item}" />
                        <button type="button" class="btn-eliminar-item text-slate-400 hover:text-rose-600 p-1 transition" title="Eliminar">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Bloque 4: Itinerario (Dinámico con Input y Botón +) -->
            <div class="space-y-3 pt-2">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <i class="fa-solid fa-route text-blue-600"></i>
                        <span>Itinerario del Viaje</span>
                    </h3>
                    <span class="text-[11px] text-slate-400 font-medium">Agrega actividades por día o etapas</span>
                </div>

                <!-- Input + Botón para agregar actividad -->
                <div class="flex gap-2">
                    <input type="text" id="inputItinerario"
                           placeholder="Ej: Día 1: Recepción en el aeropuerto, traslado al hotel y cóctel de bienvenida..."
                           class="flex-1 px-3.5 py-2 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition" />
                    <button type="button" id="btnAgregarItinerario"
                            class="px-4 py-2 rounded-xl text-xs font-bold text-white bg-[#073B78] hover:bg-[#052b57] shadow-xs flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>Agregar</span>
                    </button>
                </div>

                <!-- Lista de actividades agregadas -->
                <div id="contenedorItinerario" class="space-y-2 pt-1">
                    <!-- Itinerario existente si estamos editando -->
                    <div th:each="act, stat : ${paquete.itinerario}"
                         class="item-itinerario flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 text-xs">
                        <div class="flex items-start gap-2.5 text-slate-700">
                            <span class="w-5 h-5 rounded-full bg-[#073B78] text-white flex items-center justify-center font-bold text-[10px] shrink-0 mt-0.5"
                                  th:text="${stat.count}">1</span>
                            <span th:text="${act}" class="leading-relaxed">Actividad del itinerario</span>
                        </div>
                        <input type="hidden" name="itinerario" th:value="${act}" />
                        <button type="button" class="btn-eliminar-item text-slate-400 hover:text-rose-600 p-1 transition ml-2 shrink-0" title="Eliminar">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="pt-5 border-t border-slate-100 flex items-center justify-end gap-3">
                <a th:href="@{/admin/paquetes}"
                   class="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition">
                    Cancelar
                </a>
                <button type="submit"
                        class="px-6 py-2.5 rounded-xl text-xs font-bold text-white bg-[#073B78] hover:bg-[#052b57] shadow-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk text-xs"></i>
                    <span th:text="${paquete.idPaquete != null ? 'Actualizar Paquete' : 'Guardar Paquete'}">Guardar Paquete</span>
                </button>
            </div>
        </form>

        <!-- Script de Manejo Dinámico para Incluye e Itinerario -->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // 1. Manejo de '¿Qué incluye?'
                const inputIncluye = document.getElementById('inputIncluye');
                const btnAgregarIncluye = document.getElementById('btnAgregarIncluye');
                const contenedorIncluye = document.getElementById('contenedorIncluye');

                function agregarIncluye() {
                    const texto = inputIncluye.value.trim();
                    if (!texto) return;

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item-incluye flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 text-xs';
                    itemDiv.innerHTML = `
                        <div class="flex items-center gap-2 text-slate-700">
                            <i class="fa-solid fa-check text-emerald-600 text-xs shrink-0"></i>
                            <span>${texto}</span>
                        </div>
                        <input type="hidden" name="incluye" value="${texto}" />
                        <button type="button" class="btn-eliminar-item text-slate-400 hover:text-rose-600 p-1 transition" title="Eliminar">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    `;

                    contenedorIncluye.appendChild(itemDiv);
                    inputIncluye.value = '';
                    inputIncluye.focus();
                }

                if (btnAgregarIncluye) {
                    btnAgregarIncluye.addEventListener('click', agregarIncluye);
                    inputIncluye.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            agregarIncluye();
                        }
                    });
                }

                // 2. Manejo de 'Itinerario'
                const inputItinerario = document.getElementById('inputItinerario');
                const btnAgregarItinerario = document.getElementById('btnAgregarItinerario');
                const contenedorItinerario = document.getElementById('contenedorItinerario');

                function renumerarItinerario() {
                    const items = contenedorItinerario.querySelectorAll('.item-itinerario');
                    items.forEach((item, index) => {
                        const badge = item.querySelector('.badge-num');
                        if (badge) badge.textContent = (index + 1);
                    });
                }

                function agregarItinerario() {
                    const texto = inputItinerario.value.trim();
                    if (!texto) return;

                    const count = contenedorItinerario.querySelectorAll('.item-itinerario').length + 1;
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item-itinerario flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 text-xs';
                    itemDiv.innerHTML = `
                        <div class="flex items-start gap-2.5 text-slate-700">
                            <span class="badge-num w-5 h-5 rounded-full bg-[#073B78] text-white flex items-center justify-center font-bold text-[10px] shrink-0 mt-0.5">${count}</span>
                            <span class="leading-relaxed">${texto}</span>
                        </div>
                        <input type="hidden" name="itinerario" value="${texto}" />
                        <button type="button" class="btn-eliminar-item text-slate-400 hover:text-rose-600 p-1 transition ml-2 shrink-0" title="Eliminar">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    `;

                    contenedorItinerario.appendChild(itemDiv);
                    inputItinerario.value = '';
                    inputItinerario.focus();
                }

                if (btnAgregarItinerario) {
                    btnAgregarItinerario.addEventListener('click', agregarItinerario);
                    inputItinerario.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            agregarItinerario();
                        }
                    });
                }

                // Delegación de eventos para eliminar items
                document.addEventListener('click', (e) => {
                    const btnEliminar = e.target.closest('.btn-eliminar-item');
                    if (btnEliminar) {
                        const parent = btnEliminar.closest('.item-incluye, .item-itinerario');
                        if (parent) {
                            parent.remove();
                            renumerarItinerario();
                        }
                    }
                });
            });
        </script>

    </div>

</body>

</html>
