<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <!-- ========================================== -->
    <!-- COMPONENTE: TABLA DE ROLES Y PERMISOS      -->
    <!-- ========================================== -->
    <div th:fragment="roles" class="space-y-6">

        <!-- Encabezado con Título y Botón Nuevo Rol -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-slate-200/80 pb-5">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <a th:href="@{/admin/configuracion}" class="text-xs font-semibold text-slate-400 hover:text-[#073B78] transition flex items-center gap-1">
                        <i class="fa-solid fa-arrow-left text-[10px]"></i>
                        <span>Configuración</span>
                    </a>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">
                    Roles y Permisos
                </h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-0.5 font-medium">
                    Niveles de acceso administrativo y privilegios en la plataforma.
                </p>
            </div>

            <!-- Botón Agregar Nuevo Rol -->
            <div class="flex items-center gap-3">
                <a th:href="@{/admin/roles/nuevo}"
                   class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold text-white bg-[#073B78] hover:bg-[#052b57] shadow-sm shadow-blue-950/20 transition-all duration-200 focus:outline-none">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>Nuevo Rol</span>
                </a>
            </div>
        </div>

        <!-- Contenedor de la Tabla -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">

            <!-- Filtros / Búsqueda -->
            <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-50/50">
                <div class="relative w-full sm:w-72">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text"
                           placeholder="Buscar rol..."
                           class="w-full pl-9 pr-3 py-1.5 bg-white text-xs text-slate-700 placeholder-slate-400 rounded-xl border border-slate-200 focus:border-[#073B78] focus:outline-none transition" />
                </div>

                <div class="text-xs text-slate-400 font-medium self-end sm:self-center">
                    Mostrando <span class="font-bold text-slate-700" th:text="${roles != null ? roles.size() : 0}">0</span> registros
                </div>
            </div>

            <!-- Tabla -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase tracking-wider text-[11px]">
                            <th class="py-3.5 px-5"># ID</th>
                            <th class="py-3.5 px-5">Nombre del Rol</th>
                            <th class="py-3.5 px-5 text-center">Acciones CRUD</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-slate-700 font-medium">
                        <tr th:each="rol : ${roles}" class="hover:bg-slate-50/80 transition-colors">
                            <td class="py-3.5 px-5 font-bold text-slate-900" th:text="${rol.idRol}">1</td>
                            <td class="py-3.5 px-5">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-lg bg-slate-100 text-[#073B78] flex items-center justify-center font-bold text-xs shrink-0">
                                        <i class="fa-solid fa-shield-halved"></i>
                                    </div>
                                    <span class="font-semibold text-slate-800" th:text="${rol.nombreRol}">ADMIN</span>
                                </div>
                            </td>
                            <td class="py-3.5 px-5 text-center">
                                <div class="inline-flex items-center gap-1.5">
                                    <a th:href="@{/admin/roles/editar/{id}(id=${rol.idRol})}"
                                       class="p-1.5 text-slate-500 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition"
                                       title="Editar rol">
                                        <i class="fa-regular fa-pen-to-square text-xs"></i>
                                    </a>
                                    <a th:href="@{/admin/roles/eliminar/{id}(id=${rol.idRol})}"
                                       class="p-1.5 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                                       onclick="return confirm('¿Está seguro de eliminar este rol?');"
                                       title="Eliminar rol">
                                        <i class="fa-regular fa-trash-can text-xs"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${roles == null or #lists.isEmpty(roles)}">
                            <td colspan="3" class="py-12 text-center text-slate-400">
                                <p class="font-bold text-slate-700 text-sm">No hay roles registrados</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Footer -->
            <div class="p-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 bg-slate-50/30">
                <span>Registros totales: <b class="text-slate-800" th:text="${totalRoles != null ? totalRoles : 0}">0</b></span>
            </div>
        </div>

    </div>

</body>

</html>
