<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <div th:fragment="aerolinea-form" class="space-y-6 max-w-2xl mx-auto">

        <!-- Encabezado de Formulario -->
        <div class="flex items-center justify-between border-b border-slate-200/80 pb-4">
            <div>
                <a th:href="@{/admin/aerolineas}" class="text-xs font-semibold text-slate-400 hover:text-[#073B78] transition flex items-center gap-1.5 mb-1">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i>
                    <span>Volver al listado</span>
                </a>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900"
                    th:text="${aerolinea.idAerolinea != null ? 'Editar Aerolínea' : 'Nueva Aerolínea'}">
                    Nueva Aerolínea
                </h1>
            </div>
            <div class="w-10 h-10 rounded-xl bg-slate-100 text-[#073B78] flex items-center justify-center font-bold text-base">
                <i class="fa-solid fa-plane-departure"></i>
            </div>
        </div>

        <!-- Formulario -->
        <form th:action="@{/admin/aerolineas/guardar}" th:object="${aerolinea}" method="post"
              class="bg-white rounded-2xl border border-slate-200/80 p-6 sm:p-8 shadow-xs space-y-5">

            <!-- ID oculto para edición -->
            <input type="hidden" th:field="*{idAerolinea}" />

            <!-- Nombre de la Aerolínea -->
            <div>
                <label for="nombre" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                    Nombre de la Aerolínea <span class="text-rose-500">*</span>
                </label>
                <input type="text" id="nombre" th:field="*{nombre}" required
                       placeholder="Ej: Avianca, LATAM, Wingo..."
                       class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition" />
            </div>

            <!-- Código IATA y Tarifa Adicional -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Código IATA -->
                <div>
                    <label for="codigoIata" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                        Código IATA (2-3 Letras)
                    </label>
                    <input type="text" id="codigoIata" th:field="*{codigoIata}" maxlength="5"
                           placeholder="Ej: AV, LA, P5..."
                           class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 font-mono uppercase rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition" />
                </div>

                <!-- Precio Adicional (COP) -->
                <div>
                    <label for="precioAdicional" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                        Tarifa Adicional (COP)
                    </label>
                    <input type="number" id="precioAdicional" th:field="*{precioAdicional}" step="1000" min="0"
                           placeholder="0"
                           class="w-full px-3.5 py-2.5 bg-slate-50/50 text-sm text-slate-800 font-medium rounded-xl border border-slate-200 focus:border-[#073B78] focus:bg-white focus:outline-none transition" />
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                <a th:href="@{/admin/aerolineas}"
                   class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition">
                    Cancelar
                </a>
                <button type="submit"
                        class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-[#073B78] hover:bg-[#052b57] shadow-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk text-xs"></i>
                    <span th:text="${aerolinea.idAerolinea != null ? 'Actualizar Aerolínea' : 'Guardar Aerolínea'}">Guardar</span>
                </button>
            </div>
        </form>

    </div>

</body>

</html>
