<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <!-- COMPONENTE: CONFIGURACIÓN DINÁMICA (CRUD)  -->
    <div th:fragment="configuracion" class="space-y-6">

        <!-- Grid Dinámico de Tarjetas CRUD -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5">

            <!-- Card Iterativa Dinámica -->
            <div th:each="entidad : ${entidadesConfig}"
                 class="bg-white rounded-2xl border border-slate-200/80 p-5 flex flex-col justify-between hover:shadow-md hover:border-[#073B78] transition-all duration-200 group">
                
                <div class="flex flex-col">
                    <!-- Icono y Badge de Conteo -->
                    <div class="flex items-center justify-between mb-3.5">
                        <div class="w-10 h-10 rounded-xl bg-slate-100 text-[#073B78] flex items-center justify-center transition-colors">
                            <i th:class="${entidad.icono} + ' text-lg'"></i>
                        </div>
                        <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200/60"
                              th:text="${entidad.totalRegistros} + ' ' + ${entidad.sufijo}">
                            0 reg.
                        </span>
                    </div>

                    <!-- Título y Descripción -->
                    <h2 class="text-sm font-bold text-slate-800 transition-colors leading-snug"
                        th:text="${entidad.nombre}">
                        Entidad
                    </h2>
                    <p class="text-xs text-slate-500 mt-1.5 leading-relaxed"
                       th:text="${entidad.descripcion}">
                        Descripción de la entidad.
                    </p>
                </div>

                <!-- Botón de Gestión -->
                <div class="mt-4 pt-3 border-t border-slate-100">
                    <a th:href="@{${entidad.url}}"
                       class="w-full py-2 px-3 bg-slate-50 hover:bg-[#073B78] text-slate-700 hover:text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 border border-[#073B78] hover:border-transparent transition-all shadow-2xs">
                        <span>Gestionar</span>
                        <i class="fa-solid fa-arrow-right text-[10px]"></i>
                    </a>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
