<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{components/layout-admin/layout-admin :: admin-head('Dashboard')}">
</head>

<body class="bg-[#F4F7FC] text-slate-800 font-sans antialiased min-h-screen selection:bg-amber-400 selection:text-slate-900">

    <!-- 1. Componente Desacoplado: Sidebar Administrativo (#012653 con imagen embebida) -->
    <aside th:replace="~{components/sidebar-admin/sidebar-admin :: sidebar-admin}"></aside>

    <!-- 2. Overlay Móvil -->
    <div id="sidebar-backdrop"
        class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-40 lg:hidden hidden transition-opacity duration-300 opacity-0"
        aria-hidden="true"></div>

    <!-- 3. Estructura Principal (Desplazada lg:pl-64 por el Sidebar) -->
    <div class="lg:pl-64 flex flex-col min-h-screen">

        <!-- Topbar Administrativo -->
        <header th:replace="~{components/layout-admin/layout-admin :: admin-topbar}"></header>

        <!-- Contenido Principal: Página en blanco limpia para el administrador -->
        <main class="flex-1 p-6 lg:p-8 flex flex-col">
            <!-- Canvas en blanco -->
            <div class="flex-1 w-full bg-white rounded-2xl border border-slate-200/70 p-8 shadow-xs min-h-[75vh]">
                <!-- Área limpia lista para los módulos de administración -->
            </div>
        </main>

        <!-- Footer Administrativo -->
        <footer th:replace="~{components/layout-admin/layout-admin :: admin-footer}"></footer>
    </div>

    <!-- Scripts del Layout -->
    <th:block th:replace="~{components/layout-admin/layout-admin :: admin-scripts}"></th:block>
</body>

</html>
