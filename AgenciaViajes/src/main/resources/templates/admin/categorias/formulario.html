<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${categoria.idCategoria == null} ? 'Nueva categoría - Admin' : 'Editar categoría - Admin'">Categoría - Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link th:href="@{/css/output.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased overflow-x-hidden min-h-screen flex flex-col">

    <main class="flex-1 w-full max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-8">

        <!-- Volver -->
        <a th:href="@{/admin/categorias}"
            class="inline-flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-[#073B78] transition-colors">
            <i class="fa-solid fa-arrow-left"></i> Volver a categorías
        </a>

        <!-- Encabezado -->
        <div
            class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200/80 flex items-center gap-4">
            <div
                class="w-14 h-14 rounded-full bg-[#073B78] text-white flex items-center justify-center shadow-inner shrink-0">
                <i class="fa-solid fa-layer-group text-xl"></i>
            </div>
            <div>
                <span class="text-xs font-bold text-[#073B78] uppercase tracking-widest">Configuración</span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mt-0.5"
                    th:text="${categoria.idCategoria == null} ? 'Nueva categoría' : 'Editar categoría'">
                    Nueva categoría</h1>
                <p class="text-sm text-slate-500 mt-1">Ejemplos: Playa, Montaña, Ecoturismo, Aventura.</p>
            </div>
        </div>

        <!-- Formulario -->
        <div class="bg-white rounded-3xl shadow-xl shadow-blue-950/5 border border-slate-200/90 p-6 sm:p-8">

            <h2 class="text-lg font-extrabold text-slate-900 mb-6 border-b pb-4 border-slate-100">
                Datos de la categoría</h2>

            <form th:action="@{/admin/categorias/guardar}" th:object="${categoria}" method="POST" class="space-y-5">

                <!-- Id oculto: vacío al crear, con valor al editar -->
                <input type="hidden" th:field="*{idCategoria}">

                <div>
                    <label for="nombre"
                        class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Nombre de
                        la categoría</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required maxlength="100"
                        placeholder="Ej: Playa"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 outline-none transition-all focus:border-[#073B78] focus:ring-2 focus:ring-[#073B78]/15 focus:bg-white">
                </div>

                <!-- Botones -->
                <div class="pt-3 flex justify-end items-center gap-3">
                    <a th:href="@{/admin/categorias}"
                        class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-full text-xs transition-all border border-slate-200 shadow-sm">
                        Cancelar
                    </a>
                    <button type="submit"
                        class="px-5 py-2.5 bg-[#073B78] hover:bg-[#041E42] text-white font-bold rounded-full shadow-md hover:shadow-lg text-xs transition-all cursor-pointer">
                        <i class="fa-solid fa-floppy-disk mr-1"></i>
                        <span th:text="${categoria.idCategoria == null} ? 'Crear categoría' : 'Guardar cambios'">Guardar</span>
                    </button>
                </div>
            </form>
        </div>

    </main>

</body>

</html>
