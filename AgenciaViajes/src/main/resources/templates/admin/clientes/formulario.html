<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{components/layout-admin/layout-admin :: admin-head(${clienteForm.idCliente == null} ? 'Nuevo cliente' : 'Editar cliente')}">
</head>

<body class="bg-[#F4F7FC] text-slate-800 font-sans antialiased min-h-screen selection:bg-amber-400 selection:text-slate-900">

    <aside th:replace="~{components/sidebar-admin/sidebar-admin :: sidebar-admin}"></aside>

    <div id="sidebar-backdrop"
        class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-40 lg:hidden hidden transition-opacity duration-300 opacity-0"
        aria-hidden="true"></div>

    <div class="lg:pl-64 flex flex-col min-h-screen">
        <header th:replace="~{components/layout-admin/layout-admin :: admin-topbar}"></header>

        <main class="flex-1 p-6 lg:p-8">
            <div class="max-w-3xl mx-auto space-y-8">

                <!-- Volver -->
                <a th:href="@{/admin/clientes}"
                    class="inline-flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-[#073B78] transition-colors">
                    <i class="fa-solid fa-arrow-left"></i> Volver a clientes
                </a>

                <!-- Encabezado -->
                <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200/80 flex items-center gap-4">
                    <div class="w-14 h-14 rounded-full bg-[#073B78] text-white flex items-center justify-center shadow-inner shrink-0">
                        <i class="fa-solid fa-user text-xl"></i>
                    </div>
                    <div>
                        <span class="text-xs font-bold text-[#073B78] uppercase tracking-widest">Directorio de clientes</span>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mt-0.5"
                            th:text="${clienteForm.idCliente == null} ? 'Nuevo cliente' : 'Editar cliente'">Nuevo cliente</h1>
                    </div>
                </div>

                <!-- Formulario -->
                <div class="bg-white rounded-3xl shadow-xl shadow-blue-950/5 border border-slate-200/90 p-6 sm:p-8">
                    <h2 class="text-lg font-extrabold text-slate-900 mb-6 border-b pb-4 border-slate-100">Datos personales</h2>

                    <!-- Crear va a /guardar, editar va a /actualizar/{id} -->
                    <form th:action="${clienteForm.idCliente == null} ? @{/admin/clientes/guardar} : @{/admin/clientes/actualizar/{id}(id=${clienteForm.idCliente})}"
                        th:object="${clienteForm}" method="POST" class="grid grid-cols-1 sm:grid-cols-2 gap-5">

                        <div class="sm:col-span-2">
                            <label for="nombreCompleto" class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Nombre completo</label>
                            <input type="text" id="nombreCompleto" th:field="*{nombreCompleto}" required
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 outline-none transition-all focus:border-[#073B78] focus:ring-2 focus:ring-[#073B78]/15 focus:bg-white">
                        </div>

                        <div>
                            <label for="tipoDocumento" class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Tipo de documento</label>
                            <select id="tipoDocumento" th:field="*{tipoDocumento}" required
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 outline-none transition-all focus:border-[#073B78] focus:ring-2 focus:ring-[#073B78]/15 focus:bg-white">
                                <option th:each="t : ${T(com.example.AgenciaViajes.modelo.Enum.TipoDocumento).values()}"
                                    th:value="${t}" th:text="${t}">CC</option>
                            </select>
                        </div>

                        <div>
                            <label for="documento" class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Número de documento</label>
                            <input type="text" id="documento" th:field="*{documento}" required
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 outline-none transition-all focus:border-[#073B78] focus:ring-2 focus:ring-[#073B78]/15 focus:bg-white">
                        </div>

                        <div>
                            <label for="correo" class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Correo electrónico</label>
                            <input type="email" id="correo" th:field="*{correo}" required
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 outline-none transition-all focus:border-[#073B78] focus:ring-2 focus:ring-[#073B78]/15 focus:bg-white">
                        </div>

                        <div>
                            <label for="telefono" class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Teléfono</label>
                            <input type="text" id="telefono" th:field="*{telefono}"
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 outline-none transition-all focus:border-[#073B78] focus:ring-2 focus:ring-[#073B78]/15 focus:bg-white">
                        </div>

                        <div class="sm:col-span-2">
                            <label for="direccion" class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Dirección de residencia</label>
                            <input type="text" id="direccion" th:field="*{direccion}"
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 outline-none transition-all focus:border-[#073B78] focus:ring-2 focus:ring-[#073B78]/15 focus:bg-white">
                        </div>

                        <div>
                            <label for="estado" class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Estado</label>
                            <select id="estado" th:field="*{estado}"
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 outline-none transition-all focus:border-[#073B78] focus:ring-2 focus:ring-[#073B78]/15 focus:bg-white">
                                <option th:each="e : ${T(com.example.AgenciaViajes.modelo.Enum.EstadoGeneral).values()}"
                                    th:value="${e}" th:text="${e}">ACTIVO</option>
                            </select>
                        </div>

                        <!-- Contraseña: solo al crear -->
                        <div th:if="${clienteForm.idCliente == null}">
                            <label for="contrasena" class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Contraseña</label>
                            <input type="password" id="contrasena" name="contrasena" required minlength="6"
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 outline-none transition-all focus:border-[#073B78] focus:ring-2 focus:ring-[#073B78]/15 focus:bg-white">
                        </div>

                        <!-- Botones -->
                        <div class="sm:col-span-2 pt-3 flex justify-end items-center gap-3">
                            <a th:href="@{/admin/clientes}"
                                class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-full text-xs transition-all border border-slate-200 shadow-sm">
                                Cancelar
                            </a>
                            <button type="submit"
                                class="px-5 py-2.5 bg-[#073B78] hover:bg-[#041E42] text-white font-bold rounded-full shadow-md hover:shadow-lg text-xs transition-all cursor-pointer">
                                <i class="fa-solid fa-floppy-disk mr-1"></i>
                                <span th:text="${clienteForm.idCliente == null} ? 'Crear cliente' : 'Guardar cambios'">Guardar</span>
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </main>
    </div>

    <th:block th:replace="~{components/layout-admin/layout-admin :: admin-scripts}"></th:block>
</body>

</html>
