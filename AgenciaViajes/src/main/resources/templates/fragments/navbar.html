<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <nav th:fragment="navbar" class="bg-slate-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">

                <a th:href="@{/}" class="text-xl font-extrabold text-blue-400">AgenciaViajes</a>

                <div class="flex items-center gap-4">

                    <!-- Carrito: visible siempre, esté o no autenticado -->
                    <a th:href="@{/carrito}" class="relative text-slate-300 hover:text-white transition"
                        aria-label="Carrito de compras">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                    </a>

                    <!-- Usuario NO autenticado -->
                    <div sec:authorize="!isAuthenticated()" class="flex items-center gap-3">
                        <a th:href="@{/login}"
                            class="text-sm font-semibold text-slate-300 hover:text-white transition">Iniciar sesión</a>
                        <a th:href="@{/register}"
                            class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">Registrarse</a>
                    </div>
                    <a th:href="@{/}" class="text-xl font-extrabold text-blue-400">AgenciaViajes</a>

                    <!-- Usuario NO autenticado -->
                    <div sec:authorize="!isAuthenticated()" class="flex items-center gap-3">
                        <a th:href="@{/login}"
                            class="text-sm font-semibold text-slate-300 hover:text-white transition">Iniciar sesión</a>
                        <a th:href="@{/register}"
                            class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">Registrarse</a>
                    </div>

                    <!-- Usuario autenticado -->
                    <div sec:authorize="isAuthenticated()" class="flex items-center gap-4">
                        <span class="text-sm text-slate-300">
                            Hola, <span class="text-white font-bold"
                                sec:authentication="principal.nombreCompleto"></span>
                        </span>
                        <form th:action="@{/logout}" method="POST" class="inline">
                            <button type="submit"
                                class="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">
                                Cerrar Sesión
                            </button>
                        </form>
                    </div>

                    <!-- Usuario autenticado -->
                    <div sec:authorize="isAuthenticated()" class="flex items-center gap-4">
                        <span class="text-sm text-slate-300">
                            Hola, <span class="text-white font-bold" th:text="${nombreCliente}"></span>
                        </span>
                        <form th:action="@{/logout}" method="POST" class="inline">
                            <button type="submit"
                                class="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">
                                Cerrar Sesión
                            </button>
                        </form>
                    </div>

                </div>
            </div>
    </nav>

</body>

</html>
