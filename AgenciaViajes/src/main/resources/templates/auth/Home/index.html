<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traveling Colombia</title>

    <!-- Google Fonts: Plus Jakarta Sans & Slogan Script Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS (Compiled output) -->
    <link rel="stylesheet" th:href="@{/css/output.css}" href="/css/output.css" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>

<body
    class="bg-white text-slate-900 selection:bg-amber-400 selection:text-slate-900 font-sans antialiased overflow-x-hidden">

    <!-- 1. Componente Navbar -->
    <header th:replace="~{components/navbar/navbar :: navbar}"></header>

    <!-- Contenido Principal Organizado por Componentes -->
    <main class="w-full">
        <!-- 2. Componente Hero con Video de Fondo y Transición a Blanco -->
        <section th:replace="~{components/hero-video/hero-video :: hero-video}"></section>

        <!-- 3. Componente Explora Colombia (Destino Principal + 2 Secundarios) -->
        <section th:replace="~{components/explore-colombia/explore-colombia :: explore-colombia}"></section>

        <!-- 4. Componente ¿Por Qué Elegirnos? (4 Beneficios) -->
        <section th:replace="~{components/why-choose-us/why-choose-us :: why-choose-us}"></section>

        <!-- 5. Componente Testimonios de Viajeros -->
        <section th:replace="~{components/testimonials/testimonials :: testimonials}"></section>
    </main>

    <!-- 6. Componente Footer -->
    <footer th:replace="~{components/footer/footer :: footer}"></footer>

    <!-- Script Principal Modular (ES Modules) -->
    <script type="module" th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>

</html>
