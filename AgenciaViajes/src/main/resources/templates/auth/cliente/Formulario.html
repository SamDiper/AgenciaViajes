<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Agencia de Viajes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-2xl bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl p-8 border border-white/20">

    <div class="text-center mb-6">
        <h2 class="text-3xl font-extrabold text-slate-800" th:text="${titulo}">Editar Perfil</h2>
        <p class="text-sm text-slate-500 mt-1">Actualiza tu información personal y de contacto</p>
    </div>

    <form th:action="@{/clientes/actualizar/{id}(id=${cliente.idCliente})}"
          th:object="${cliente}"
          method="POST"
          class="space-y-5">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="nombreCompleto" class="block text-sm font-semibold text-slate-700 mb-1">Nombre Completo</label>
                <input type="text" id="nombreCompleto" th:field="*{nombreCompleto}" required
                       class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <div>
                <label for="telefono" class="block text-sm font-semibold text-slate-700 mb-1">Teléfono</label>
                <input type="text" id="telefono" th:field="*{telefono}" required
                       class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Tipo Documento</label>
                <input type="text" th:field="*{tipoDocumento}" disabled
                       class="w-full px-4 py-2.5 bg-slate-200 border border-slate-300 rounded-lg text-slate-500 cursor-not-allowed font-medium">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Documento de Identidad</label>
                <input type="text" th:field="*{documento}" disabled
                       class="w-full px-4 py-2.5 bg-slate-200 border border-slate-300 rounded-lg text-slate-500 cursor-not-allowed font-medium">
            </div>
        </div>

        <div>
            <label for="direccion" class="block text-sm font-semibold text-slate-700 mb-1">Dirección de Residencia</label>
            <input type="text" id="direccion" th:field="*{direccion}"
                   class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Correo Electrónico Registrado</label>
            <input type="email" th:field="*{correo}" disabled
                   class="w-full px-4 py-2.5 bg-slate-200 border border-slate-300 rounded-lg text-slate-500 cursor-not-allowed font-medium">
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
            <a th:href="@{/home}"
               class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg transition duration-200">
                Cancelar
            </a>
            <button type="submit"
                    class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-lg shadow-lg hover:shadow-blue-500/30 transition duration-200">
                Guardar Cambios
            </button>
        </div>
    </form>
</div>

</body>
</html>
