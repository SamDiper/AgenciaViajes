<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pago exitoso — Traveling Colombia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/output.css}" href="/css/output.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased overflow-x-hidden min-h-screen flex flex-col">

    <header th:replace="~{components/navbar/navbar :: navbar}"></header>

    <main class="w-full max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-16 flex-1">

        <div class="bg-white rounded-3xl p-6 sm:p-10 border border-slate-200/90 shadow-xl shadow-blue-950/5 text-center">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center">
                <i class="fa-solid fa-check text-2xl"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">¡Pago exitoso!</h1>
            <p class="text-sm text-slate-500 mt-2">
                Tu reserva <span class="font-bold text-slate-700" th:text="'#RES-' + ${reserva.id}">#RES-1</span> está confirmada.
                Te enviamos la factura y el itinerario a tu correo.
            </p>

            <!-- Datos de la factura -->
            <div class="mt-8 text-left rounded-2xl bg-slate-50 border border-slate-200 p-5 space-y-3 text-sm">
                <div class="flex justify-between gap-3">
                    <span class="text-slate-500">Factura</span>
                    <span class="font-bold text-slate-800" th:text="${factura.numero}">FAC-000001</span>
                </div>
                <div class="flex justify-between gap-3">
                    <span class="text-slate-500">Fecha</span>
                    <span class="font-semibold text-slate-800"
                        th:text="${#temporals.format(factura.fechaEmision, 'dd/MM/yyyy HH:mm')}">--/--/----</span>
                </div>
                <div class="flex justify-between gap-3">
                    <span class="text-slate-500">Método de pago</span>
                    <span class="font-semibold text-slate-800"
                        th:text="${factura.metodoPago} + (${factura.ultimosDigitos} != null ? ' •••• ' + ${factura.ultimosDigitos} : '')">Tarjeta</span>
                </div>
                <div class="flex justify-between gap-3 pt-3 border-t border-slate-200">
                    <span class="text-slate-500">Subtotal</span>
                    <span class="font-semibold text-slate-800"
                        th:text="'$' + ${#numbers.formatDecimal(factura.subtotal, 0, 'POINT', 0, 'COMMA')}">$0</span>
                </div>
                <div class="flex justify-between gap-3">
                    <span class="text-slate-500">IVA (19%)</span>
                    <span class="font-semibold text-slate-800"
                        th:text="'$' + ${#numbers.formatDecimal(factura.iva, 0, 'POINT', 0, 'COMMA')}">$0</span>
                </div>
                <div class="flex justify-between gap-3 items-baseline">
                    <span class="font-bold text-slate-700">Total pagado</span>
                    <span class="text-xl font-extrabold text-[#073B78]"
                        th:text="'$' + ${#numbers.formatDecimal(factura.total, 0, 'POINT', 0, 'COMMA')}">$0</span>
                </div>
            </div>

            <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
                <a th:href="@{/pago/{id}/factura(id=${reserva.id})}"
                    class="inline-flex items-center gap-2 bg-[#073B78] hover:bg-[#041E42] text-white font-bold text-sm px-6 py-3 rounded-full transition-colors">
                    <i class="fa-solid fa-file-arrow-down"></i> Descargar factura
                </a>
                <a th:href="@{/}" href="/"
                    class="inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm px-6 py-3 rounded-full border border-slate-200 transition-colors">
                    Volver al inicio
                </a>
            </div>
        </div>
    </main>

    <footer th:replace="~{components/footer/footer :: footer}"></footer>

    <script type="module" th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>

</html>
