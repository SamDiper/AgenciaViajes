<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis Reservas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/output.css}" href="/css/output.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased overflow-x-hidden min-h-screen flex flex-col">

    <header th:replace="~{components/navbar/navbar :: navbar}"></header>

    <section class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-16 flex-1">
        <div class="bg-white rounded-3xl shadow-xl shadow-blue-950/5 border border-slate-200/90 p-6 sm:p-8">

            <header class="mb-8 border-b border-slate-100 pb-6">
                <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight"
                    th:text="${tituloPanel} ?: 'Mis Reservas'">Mis Reservas</h1>
                <p class="text-slate-500 mt-2 text-sm">Revisa el estado de tus próximos viajes.</p>
            </header>

            <!-- Mensajes flash (vienen de RedirectAttributes) -->
            <div th:if="${exito}" role="status"
                 class="mb-6 flex items-start gap-3 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 text-sm">
                <i class="fa-solid fa-circle-check mt-0.5"></i>
                <span th:text="${exito}"></span>
            </div>
            <div th:if="${error}" role="alert"
                 class="mb-6 flex items-start gap-3 rounded-2xl bg-red-50 border border-red-200 text-red-800 px-4 py-3 text-sm">
                <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- Sin reservas -->
            <div th:if="${#lists.isEmpty(reservas)}"
                 class="bg-slate-50 rounded-2xl p-10 text-center border-2 border-dashed border-slate-200">
                <div class="h-14 w-14 mx-auto mb-4 rounded-full bg-[#073B78]/10 flex items-center justify-center">
                    <i class="fa-solid fa-suitcase-rolling text-2xl text-[#073B78]"></i>
                </div>
                <p class="text-slate-600 font-semibold">Aún no tienes reservas.</p>
                <p class="text-sm text-slate-400 mt-1">Elige un paquete y agrégalo al carrito para empezar.</p>
                <a th:href="@{/paquetes}"
                   class="inline-block mt-6 px-6 py-3 rounded-2xl bg-[#073B78] hover:bg-[#041E42] text-white text-sm font-bold transition-colors">
                    Ver paquetes
                </a>
            </div>

            <!-- Listado -->
            <div th:unless="${#lists.isEmpty(reservas)}" class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500">
                            <th class="py-3 pr-4 font-bold text-xs uppercase tracking-wider">N.°</th>
                            <th class="py-3 pr-4 font-bold text-xs uppercase tracking-wider">Reservada el</th>
                            <th class="py-3 pr-4 font-bold text-xs uppercase tracking-wider">Fecha de viaje</th>
                            <th class="py-3 pr-4 font-bold text-xs uppercase tracking-wider">Paquetes</th>
                            <th class="py-3 pr-4 font-bold text-xs uppercase tracking-wider text-right">Total</th>
                            <th class="py-3 pr-4 font-bold text-xs uppercase tracking-wider">Estado</th>
                            <th class="py-3"><span class="sr-only">Acciones</span></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <tr th:each="r : ${reservas}" class="align-top hover:bg-slate-50/60 transition-colors">
                            <td class="py-4 pr-4 font-extrabold text-[#073B78]" th:text="'#' + ${r.id}">#1</td>
                            <td class="py-4 pr-4 text-slate-600"
                                th:text="${#temporals.format(r.fechaReserva, 'dd/MM/yyyy')}">01/01/2026</td>
                            <td class="py-4 pr-4 text-slate-600">
    <div th:each="d : ${r.detalles}"
         th:text="${#temporals.format(d.fechaViaje, 'dd/MM/yyyy')}">
        15/02/2026
    </div>
</td>
<td class="py-4 pr-4 text-slate-700">
    <div th:each="d : ${r.detalles}"
         th:text="${d.paquete.nombre} + ' × ' + ${d.cantidadPersonas} + (${d.cantidadPersonas} == 1 ? ' persona' : ' personas')">
        Paquete × 2 personas
    </div>
</td>
                            <td class="py-4 pr-4 text-right font-extrabold text-[#073B78] whitespace-nowrap"
                                th:text="'$' + ${#numbers.formatDecimal(r.total, 0, 'POINT', 0, 'COMMA')}">$0</td>
                            <td class="py-4 pr-4">
                                <span class="inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider"
                                      th:text="${r.estadoReserva}"
                                      th:classappend="${r.estadoReserva.name() == 'CONFIRMADA'} ? 'bg-emerald-100 text-emerald-800'
                                          : (${r.estadoReserva.name() == 'CANCELADA'} ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800')">
                                    PENDIENTE
                                </span>
                            </td>
                            <td class="py-4 text-right whitespace-nowrap">
                                <a th:href="@{/reservas/{id}(id=${r.id})}"
                                   class="px-3 py-1.5 rounded-xl border border-slate-300 text-slate-700 text-xs font-bold hover:border-[#073B78] hover:text-[#073B78] transition-colors">
                                    Ver detalle
                                </a>
                                <form th:if="${r.estadoReserva.name() == 'PENDIENTE'}"
                                      th:action="@{/reservas/{id}/cancelar(id=${r.id})}"
                                      method="post" class="inline"
                                      onsubmit="return confirm('¿Cancelar esta reserva?')">
                                    <button type="submit"
                                            class="ml-1 px-3 py-1.5 rounded-xl border border-red-300 text-red-700 text-xs font-bold hover:bg-red-50 transition-colors cursor-pointer">
                                        Cancelar
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </section>

    <footer th:replace="~{components/footer/footer :: footer}"></footer>

    <script type="module" th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
