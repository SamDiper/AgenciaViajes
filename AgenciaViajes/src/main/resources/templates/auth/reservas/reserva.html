<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis Reservas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" th:href="@{/css/output.css}" href="/css/output.css" />

    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-50">

    <header th:replace="~{components/navbar/navbar :: navbar}"></header>

    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">

            <header class="mb-8 border-b border-slate-100 pb-4">
                <h1 class="text-3xl font-bold text-slate-800" th:text="${tituloPanel} ?: 'Mis Reservas'">Mis Reservas</h1>
                <p class="text-slate-500 mt-2">Revisa el estado de tus próximos viajes.</p>
            </header>

            <!-- Mensajes flash (vienen de RedirectAttributes) -->
            <div th:if="${exito}" role="status"
                 class="mb-6 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3"
                 th:text="${exito}"></div>
            <div th:if="${error}" role="alert"
                 class="mb-6 rounded-xl bg-red-50 border border-red-200 text-red-800 px-4 py-3"
                 th:text="${error}"></div>

            <!-- Sin reservas -->
            <div th:if="${#lists.isEmpty(reservas)}"
                 class="bg-slate-50 rounded-xl p-8 text-center border-2 border-dashed border-slate-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-slate-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
                </svg>
                <p class="text-slate-500 font-medium">Aún no tienes reservas.</p>
                <p class="text-sm text-slate-400 mt-1">Elige un paquete y agrégalo al carrito para empezar.</p>
                <a th:href="@{/paquetes}"
                   class="inline-block mt-5 px-5 py-2.5 rounded-lg bg-slate-800 text-white text-sm font-semibold hover:bg-slate-700">
                    Ver paquetes
                </a>
            </div>

            <!-- Listado -->
            <div th:unless="${#lists.isEmpty(reservas)}" class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500">
                            <th class="py-3 pr-4 font-semibold">N.°</th>
                            <th class="py-3 pr-4 font-semibold">Reservada el</th>
                            <th class="py-3 pr-4 font-semibold">Fecha de viaje</th>
                            <th class="py-3 pr-4 font-semibold">Paquetes</th>
                            <th class="py-3 pr-4 font-semibold text-right">Total</th>
                            <th class="py-3 pr-4 font-semibold">Estado</th>
                            <th class="py-3"><span class="sr-only">Acciones</span></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <tr th:each="r : ${reservas}" class="align-top">
                            <td class="py-4 pr-4 font-semibold text-slate-800" th:text="'#' + ${r.id}">#1</td>
                            <td class="py-4 pr-4 text-slate-600"
                                th:text="${#temporals.format(r.fechaReserva, 'dd/MM/yyyy')}">01/01/2026</td>
                            <td class="py-4 pr-4 text-slate-600"
                                th:text="${#temporals.format(r.fechaViaje, 'dd/MM/yyyy')}">15/02/2026</td>
                            <td class="py-4 pr-4 text-slate-700">
                                <div th:each="d : ${r.detalles}"
                                     th:text="${d.paquete.nombre} + ' × ' + ${d.cantidadPersonas} + (${d.cantidadPersonas} == 1 ? ' persona' : ' personas')">
                                    Paquete × 2 personas
                                </div>
                            </td>
                            <td class="py-4 pr-4 text-right font-semibold text-slate-800 whitespace-nowrap"
                                th:text="'$' + ${#numbers.formatDecimal(r.total, 0, 'POINT', 0, 'COMMA')}">$0</td>
                            <td class="py-4 pr-4">
                                <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold"
                                      th:text="${r.estadoReserva}"
                                      th:classappend="${r.estadoReserva.name() == 'CONFIRMADA'} ? 'bg-emerald-100 text-emerald-800'
                                          : (${r.estadoReserva.name() == 'CANCELADA'} ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800')">
                                    PENDIENTE
                                </span>
                            </td>
                            <td class="py-4 text-right whitespace-nowrap">
                                <a th:href="@{/reservas/{id}(id=${r.id})}"
                                   class="px-3 py-1.5 rounded-lg border border-slate-300 text-slate-700 text-xs font-semibold hover:bg-slate-50">
                                    Ver detalle
                                </a>
                                <form th:if="${r.estadoReserva.name() == 'PENDIENTE'}"
                                      th:action="@{/reservas/{id}/cancelar(id=${r.id})}"
                                      method="post" class="inline"
                                      onsubmit="return confirm('¿Cancelar esta reserva?')">
                                    <button type="submit"
                                            class="ml-1 px-3 py-1.5 rounded-lg border border-red-300 text-red-700 text-xs font-semibold hover:bg-red-50">
                                        Cancelar
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </section>

</body>
</html>
