<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Agencia de Viajes</title>
    <link rel="stylesheet" th:href="@{/css/output.css}" href="/css/output.css" />

</head>

<body
    class="bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl p-8 border border-white/20">

        <!-- Encabezado con marca/logo -->
        <div class="text-center mb-6">
            <div
                class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 text-white rounded-2xl shadow-lg mb-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 002 2h1.5a2.5 2.5 0 002.5-2.5V11a2 2 0 012-2h1.065M15 20.488V18a2 2 0 012-2h3.064">
                    </path>
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold text-slate-800">¡Bienvenido!</h2>
            <p class="text-sm text-slate-500 mt-1">Ingresa a tu cuenta para gestionar tus viajes</p>
        </div>

        <!-- Alertas de estado -->
        <div th:if="${errorMessage}"
            class="mb-4 p-3 bg-red-100 border-l-4 border-red-500 text-red-700 rounded text-sm flex items-center gap-2">
            <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                    d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                    clip-rule="evenodd"></path>
            </svg>
            <span th:text="${errorMessage}">Error de autenticación</span>
        </div>

        <div th:if="${successMessage}"
            class="mb-4 p-3 bg-emerald-100 border-l-4 border-emerald-500 text-emerald-700 rounded text-sm flex items-center gap-2">
            <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                    clip-rule="evenodd"></path>
            </svg>
            <span th:text="${successMessage}">Mensaje de éxito</span>
        </div>

        <!-- Formulario procesado por Spring Security -->
        <form th:action="@{/login}" method="POST" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1">Correo Electrónico</label>
                <!-- Mapeado a "correo" -->
                <input type="email" id="username" name="correo" required autofocus
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="usuario@ejemplo.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                <!-- Mapeado a "contrasena" -->
                <input type="password" id="password" name="contrasena" required
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-blue-500/30 transition duration-200">
                Iniciar Sesión
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-600">
            ¿Aún no tienes una cuenta?
            <a th:href="@{/clientes}" class="text-blue-600 hover:text-blue-700 font-bold hover:underline">Regístrate
                aquí</a>
        </div>
    </div>

</body>

</html>
